  <!--
    You can customize the "flutter_bootstrap.js?v=da0e6adc1ed8fb7436d9fd86aa859085" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 3D 그리기 연결(WebGL)이 끊기면 화면이 검게 남는다. 폰에서 다른 앱에 다녀오면 자주 끊긴다.
    // 진행은 저장돼 있으니 다시 불러와 하던 방으로 돌아간다.
    (function () {
      if (typeof OffscreenCanvas === 'undefined') return;
      var original = OffscreenCanvas.prototype.getContext;
      var recovering = false;
      function recover() {
        if (recovering) return;
        try {
          // 불러오자마자 또 끊기는 기기에서 끝없이 되풀이하지 않는다.
          var last = Number(sessionStorage.getItem('cheolkeok.recovered') || 0);
          if (Date.now() - last < 15000) return;
          sessionStorage.setItem('cheolkeok.recovered', String(Date.now()));
        } catch (e) {}
        recovering = true;
        var url = new URL(location.href);
        url.searchParams.set('resume', '1');
        location.replace(url);
      }
      OffscreenCanvas.prototype.getContext = function (kind, attrs) {
        var context = original.apply(this, arguments);
        // 3D 장면이 쓰는 연결만 지켜본다 (화면 글씨를 그리는 연결은 엔진이 알아서 되살린다).
        if (context && kind === 'webgl2' && attrs &&
            attrs.preserveDrawingBuffer === true && attrs.depth === false &&
            !context.__watched) {
          context.__watched = true;
          this.addEventListener('webglcontextlost', recover);
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden && context.isContextLost()) recover();
          });
        }
        return context;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js?v=da0e6adc1ed8fb7436d9fd86aa859085" async></script>
</body>
